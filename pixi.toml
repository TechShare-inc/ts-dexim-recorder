[workspace]
authors = ["haoyan.li <haoyan.li@techshare.co.jp>"]
channels = ["conda-forge"]
name = "ts-dexim-recorder"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
test = "pytest tests/ -m 'not hardware'"
test-cov = "pytest tests/ -m 'not hardware' --cov=src/dexim/recorder --cov-report=term-missing"

[dependencies]
python = "3.10.*"
hdf5 = ">=1.12"

[pypi-dependencies]
dexim-recorder = { path = ".", editable = true }
# Gate 2 accepted baseline: ts-dexim-core/dev.
dexim-core = { git = "https://github.com/TechShare-inc/ts-dexim-core.git", rev = "7bcbec6b8ab8d61e411e87843a0bf6e84fe7ad88" }
# Gate 2 accepted baseline: ts-dexim-cli-common/dev at
# f427f441b8258c4430afaa21b011ed78cc22e14e (sibling checkout for development).
dexim-cli-common = { path = "../dexim-cli-common", editable = true }
pytest = ">=9.0.2, <10"
pytest-cov = ">=7.0.0, <8"
ruff = ">=0.15.5, <0.16"
